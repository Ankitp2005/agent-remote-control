<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agent Remote Control</title>
  <meta name="description" content="Mobile remote control for local AI coding agent sessions">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 100 100">
          <rect width="100" height="100" rx="20" fill="#0f172a"/>
          <path d="M30 35 L45 50 L30 65" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <rect x="52" y="60" width="20" height="6" fill="#38bdf8" rx="3"/>
        </svg>
        <span class="brand-title">Agent Control</span>
      </div>

      <div class="status-badge" id="status-badge">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Disconnected</span>
      </div>

      <button id="open-settings-btn" class="btn-icon" title="Connection Settings">
        ⚙️
      </button>
    </header>

    <!-- Session Selector Bar -->
    <div class="session-bar">
      <label for="session-select" class="session-label">Session:</label>
      <select id="session-select" class="session-select" disabled>
        <option value="">Select a session...</option>
      </select>
      <button id="refresh-sessions-btn" class="btn-icon" title="Refresh Sessions" disabled>
        🔄
      </button>
    </div>

    <!-- Error Banner -->
    <div id="error-banner" class="error-banner hidden">
      <span id="error-message">Connection error</span>
      <button id="dismiss-error-btn">&times;</button>
    </div>

    <!-- Terminal Output -->
    <main id="output-pane" class="output-pane" aria-live="polite"></main>

    <!-- Prompt Input Form -->
    <form id="prompt-form" class="input-bar">
      <input 
        type="text" 
        id="prompt-input" 
        class="prompt-input" 
        placeholder="Type a prompt for the agent..." 
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        disabled
      >
      <button type="submit" id="send-btn" class="send-btn" disabled>Send</button>
    </form>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 class="modal-title">Daemon Settings</h2>
      <p class="modal-subtitle">Configure your Tailscale connection details</p>
      
      <form id="settings-form">
        <div class="form-group">
          <label class="form-label" for="setting-ip">Tailscale IP</label>
          <input type="text" id="setting-ip" class="form-input" placeholder="e.g. 100.127.211.91" required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="setting-port">Port</label>
          <input type="number" id="setting-port" class="form-input" placeholder="8787" value="8787" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="setting-token">Auth Token</label>
          <input type="password" id="setting-token" class="form-input" placeholder="Paste AUTH_TOKEN from .env" required>
        </div>

        <div class="form-actions">
          <button type="button" id="cancel-settings-btn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save & Connect</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
